repos:
  - repo: local
    hooks:
      - id: ruff-security-scan
        name: Ruff security scan (S rules)
        entry: ruff check --output-format=concise
        language: python
        additional_dependencies: ["ruff==0.16.8"]
        types: [python]

      - id: detect-secrets-scan
        name: detect-secrets scan
        entry: detect-secrets-hook
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        exclude: \.jsonl$|/evidence/

      - id: pip-audit-scan
        name: pip-audit dependency scan
        entry: python scripts/test/pip_audit_all.py
        language: python
        additional_dependencies: ["pip-audit==2.10.1"]
        files: (^|/)requirements[^/]*\.txt$