repos:
  - repo: local
    hooks:
      - id: ruff-security-scan
        name: Ruff security scan (S rules)
        entry: ruff check --select E4,E7,E9,F,S --output-format=concise
        language: python
        additional_dependencies: ["ruff==0.16.8"]
        types: [python]

      - id: detect-secrets-scan
        name: detect-secrets scan
        entry: detect-secrets-hook
        # Verified public evidence/file digests; retain original historical evidence bytes.
        # Exact digest values only; all other content in these files is still scanned.
        args:
          - --exclude-lines
          - '17a445c1037e6792befc6df0bfc25341d4a49b973587f32e25c67131725d01e4|c217f786ea72197f316f92f8cef5c9411c87219688c9f7eab1bd4971e3b86655|ceccc93d0302bae6b56fb7b9d7ac185da63fb12eddd952fb00b33e1d0fee4868|080232decedb3831b70721a3450c2e8d2c2866524f24a604f3d268558a65674f'
        language: python
        additional_dependencies: ["detect-secrets==1.5.0"]
        exclude: \.jsonl$

      - id: pip-audit-scan
        name: pip-audit dependency scan
        entry: python scripts/test/pip_audit_all.py
        language: python
        additional_dependencies: ["pip-audit==2.10.1"]
        files: (^|/)requirements[^/]*\.txt$
