<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KICKLAB — Customer MCP Tools</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        .mcp-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .mcp-state {
            font-weight: 700;
            font-size: 0.78rem;
            padding: 3px 12px;
            border-radius: 100px;
        }

        .mcp-state.on {
            background: rgba(0, 200, 120, 0.12);
            color: #0a9960;
        }

        .mcp-state.off {
            background: rgba(255, 61, 154, 0.12);
            color: var(--pink);
        }

        .tool-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .tool-card h3 {
            margin: 0 0 4px;
            font-size: 1.05rem;
        }

        .tool-card p {
            margin: 0 0 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .lookup-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .lookup-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: var(--radius);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 1rem;
            background: #fff;
        }

        .lookup-row input:focus {
            outline: none;
            border-color: var(--purple);
        }

        #mcp-result {
            margin-top: 28px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
        }

        #mcp-result pre {
            background: #f6f5fb;
            border-radius: var(--radius);
            padding: 14px;
            overflow-x: auto;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="bg-effects" aria-hidden="true">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
        <div class="bg-orb bg-orb-4"></div>
        <div class="bg-grid"></div>
    </div>

    <header class="scrolled">
        <div class="container header-inner">

            <a href="/" class="logo">
                <span class="logo-name">KICKLAB</span>
            </a>

            <div class="header-actions">
                <a href="/" class="btn btn-glass">
                    Back to Account
                </a>
            </div>

        </div>
    </header>

    <section class="finder">
        <div class="container">

            <span class="section-tag">MCP Tools</span>

            <h2 class="section-title">
                Customer account tools
            </h2>

            <p class="section-sub">
                Run Customer Account Management tools through the Student 3
                backend and shared MCP server.
            </p>

            <div class="mcp-toggle-row">

                <label>
                    <input
                        id="mcp-mode-toggle"
                        type="checkbox"
                        checked
                    >
                    MCP mode
                </label>

                <span
                    id="mcp-mode-state"
                    class="mcp-state on"
                >
                    On
                </span>

            </div>

            <div class="tool-card">

                <h3>Customer summary</h3>

                <p>
                    Retrieve safe account details for one customer.
                </p>

                <form
                    class="lookup-row mcp-action"
                    hx-post="/mcp/customer-summary"
                    hx-target="#mcp-result"
                >

                    <input
                        type="number"
                        name="customer_id"
                        min="1"
                        placeholder="Customer ID, e.g. 1"
                        required
                    >

                    <button
                        type="submit"
                        class="btn btn-gradient"
                    >
                        Run tool
                    </button>

                </form>

            </div>

            <div id="mcp-result">
                Tool results will appear here.
            </div>

        </div>
    </section>

    <footer>
        <p class="footer-copy">
            &copy; 2026 KICKLAB · Customer Account Management
        </p>
    </footer>

    <script>
        const toggle =
            document.getElementById("mcp-mode-toggle");

        const stateLabel =
            document.getElementById("mcp-mode-state");

        const resultPanel =
            document.getElementById("mcp-result");

        const STORAGE_KEY =
            "customer_mcp_mode_enabled";


        function isOn() {
            return toggle.checked;
        }


        function renderState() {
            stateLabel.textContent =
                isOn() ? "On" : "Off";

            stateLabel.className =
                "mcp-state " +
                (isOn() ? "on" : "off");
        }


        function showOffMessage() {
            resultPanel.innerHTML =
                "<p>MCP mode is off. Turn it on to run tools.</p>";
        }


        const saved =
            localStorage.getItem(STORAGE_KEY);

        toggle.checked =
            saved === null
                ? true
                : saved === "true";

        renderState();

        if (!isOn()) {
            showOffMessage();
        }


        toggle.addEventListener(
            "change",
            () => {
                localStorage.setItem(
                    STORAGE_KEY,
                    String(isOn())
                );

                renderState();

                if (!isOn()) {
                    showOffMessage();
                }
            }
        );


        document.body.addEventListener(
            "htmx:configRequest",
            (event) => {
                if (
                    event.detail.elt.classList.contains(
                        "mcp-action"
                    )
                ) {
                    event.detail.headers["X-MCP-Mode"] =
                        isOn() ? "on" : "off";
                }
            }
        );


        document.body.addEventListener(
            "htmx:beforeRequest",
            (event) => {
                if (
                    event.detail.elt.classList.contains(
                        "mcp-action"
                    ) &&
                    !isOn()
                ) {
                    event.preventDefault();
                    showOffMessage();
                }
            }
        );


        document.body.addEventListener(
            "htmx:beforeSwap",
            (event) => {
                if (event.detail.xhr.status >= 400) {
                    event.detail.shouldSwap = true;
                    event.detail.isError = false;
                }
            }
        );
    </script>

</body>
</html>
