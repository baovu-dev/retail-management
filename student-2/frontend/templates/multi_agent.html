<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Management - Multi-Agent</title>
    <link rel="stylesheet" href="/static/styles.css">

    <style>
        .agent-container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .agent-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
        }

        .agent-card h2 {
            margin-bottom: 20px;
        }

        .agent-card label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .agent-card textarea {
            width: 100%;
            min-height: 150px;
            padding: 16px;
            border: 1.5px solid var(--border);
            border-radius: 13px;
            background: var(--surface-soft);
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            margin-bottom: 18px;
        }

        .agent-card textarea:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 4px rgba(155, 93, 229, 0.1);
        }

        .agent-card button {
            padding: 13px 22px;
            border: none;
            border-radius: 13px;
            background: var(--gradient);
            color: white;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            margin: 6px 8px 6px 0;
        }
      
        .agent-card button:hover {
            opacity: 0.9;
        }

        .agent-card pre {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 20px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .agent-subtitle {
            text-align: center;
            color: var(--muted);
            margin: -25px auto 35px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: var(--purple);
            font-weight: 600;
            text-decoration: none;
        }

        #review {
            display: none;
        }

    </style>
</head>
<body>
    <div class="agent-container">
    <h1>Product Management - Multi-Agent</h1>
    <p class="agent-subtitle">Planner -> Worker -> Reviewer -> Human Review</p>


    <div class="agent-card">
        <label for="request">Product analysis request:</label>
        <textarea id="request" rows="4" 
        placeholder="Analyse product 103 and suggest improvements"></textarea>
        <button id="run">Run Multi-Agent Workflow</button>
    </div>

    <div class="agent-card">
        <h2>Workflow Result</h2>
        <pre id="result">No workflow started.</pre>
    </div>

    <section id="review" class="agent-card">
        <h2>Human Review</h2>
        <textarea id="comment" rows="2" placeholder="Optional reviewer comment"></textarea>
        <textarea id="correction" rows="3" placeholder="Corrected output (for Correct)"></textarea>
        <div>
            <button onclick="submitDecision('Approve')">Approve</button>
            <button onclick="submitDecision('Correct')">Correct</button>
            <button onclick="submitDecision('Reject')">Reject</button>
        </div>
    </section>

    </div>
    <script>
        const API = `${location.protocol}//${location.hostname}:5002`;
        let workflowId = null;

        async function apiRequest(path, options = {}) {
            const response = await fetch(`${API}${path}`, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || JSON.stringify(data));
            return data;
        }

        document.getElementById("run").addEventListener("click", async () => {
            const userRequest = document.getElementById("request").value.trim();
            if (!userRequest) return alert("Enter a request first.");

            document.getElementById("result").textContent = "Running workflow...";
            document.getElementById("review").style.display = "none";

            try {
                const data = await apiRequest("/multi-agent/workflow", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_request: userRequest })
                });
                workflowId = data.workflow_id || data.id;
                document.getElementById("result").textContent = JSON.stringify(data, null, 2)
                if (workflowId) document.getElementById("review").style.display = "block";
            } catch (error) {
                document.getElementById("result").textContent = error.message;
            }
        });

        async function submitDecision(decision) {
            if (!workflowId) return;
            try {
                const data = await apiRequest(
                    `/multi-agent/workflow/${encodeURIComponent(workflowId)}/decision`,
                    {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        decision,
                        reviewer: "student-2",
                        comment: document.getElementById("comment").value,
                        corrected_output: document.getElementById("correction").value
                    })
                }
            );
            document.getElementById("result").textContent = JSON.stringify(data, null, 2);
            document.getElementById("review").style.display = "none";
            } catch (error) {
                document.getElementById("result").textContent = error.message;
            }
        }
    </script>
</body>
</html>
