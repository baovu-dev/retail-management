<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <h1>Product Management</h1>

    <h2>Add Product</h2>

    <form id="product-form">
        <input type="text" id="name" placeholder="Product Name" required>
        <input type="text" id="category" placeholder="Category" required>
        <input type="text" id="description" placeholder="Description">
        <input type="number" id="price" placeholder="Price" step="0.01" required>
        <input type="text" id="brand" placeholder="Brand">

        <select id="status">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>

        <button type="submit">Add Product</button>
    </form>

<h2>Products</h2>

<div id="product-list"></div>

<h2>Shared AI Services</h2>

<h3>MCP Product Lookup</h3>
<input type="number" id="mcp-product-id" placeholder="Product ID">
<button onclick="lookupMCPProduct()">Get Product via MCP</button>
<pre id="mcp-result"></pre>

<h3>RAG Product Assistant</h3>
<input type="text" id="rag-query" placeholder="Ask about Product Management">
<button onclick="askRAG()">Ask RAG</button>
<pre id="rag-result"></pre>

<script>
    const API_URL = "http://localhost:5002";

    async function loadProducts() {
        const response = await fetch(`${API_URL}/products`);
        const products = await response.json();

        const productList = document.getElementById("product-list");
        productList.innerHTML = "";

        products.forEach(product => {
            const productDiv = document.createElement("div");
            productDiv.innerHTML = `
                <h3>${product.name}</h3>
                <p>Brand: ${product.brand}</p>
                <p>Category: ${product.category}</p>
                <p>Price: $${product.price}</p>
                <p>Status: ${product.status}</p>
                <p>${product.description || ""}</p>

               <button onclick="editProduct(${product.product_id})">
                    Edit
                </button>

                <button onclick="generateDescription(${product.product_id})">
                    Generate AI Description
                </button>

                <button onclick="deleteProduct(${product.product_id})">
                    Delete
                </button>

                <hr>
            `;

            productList.appendChild(productDiv);
        });
    }

    document.getElementById("product-form").addEventListener(
        "submit", 
        async function(event) {
            event.preventDefault();

            const product = {
                name: document.getElementById("name").value,
                category: document.getElementById("category").value,
                description: document.getElementById("description").value,
                price: Number(document.getElementById("price").value),
                brand: document.getElementById("brand").value,
                status: document.getElementById("status").value
            };
            
            await fetch(`${API_URL}/products`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            document.getElementById("product-form").reset();
            loadProducts();

        }
    );

    async function editProduct(productId) {
        const response = await fetch(`${API_URL}/products/${productId}`);
        const product = await response.json();

        const name = prompt("Edit Product Name:", product.name);
        if (name === null) return;

        const category = prompt("Edit Category:", product.category);
        if (category === null) return;

        const description = prompt("Edit Description:", product.description || "");
        if (description === null) return;

        const price = prompt("Edit Price:", product.price);
        if (price === null) return;

        const brand = prompt("Edit Brand:", product.brand || "");
        if (brand === null) return;
        
        const status = prompt("Edit Status (active/inactive):", product.status);
        if (status === null) return;

        await fetch(`${API_URL}/products/${productId}`, {
            method: "PUT",
            headers: { 
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                category: category,
                description: description,
                price: Number(price),
                brand: brand,
                status: status
            })
        });
        
        loadProducts();
    }

    async function deleteProduct(productId) {
        await fetch(`${API_URL}/products/${productId}`, {
            method: "DELETE"
        });
        loadProducts();
    }

    async function generateDescription(productId) {
        const response = await fetch(
            `${API_URL}/products/${productId}/generate-description`, 
            {
            method: "POST"
        }
    
    );
    
    const result = await response.json();

    alert(result.description);
    }

    async function lookupMCPProduct() {
        const productId = document.getElementById("mcp-product-id").value;
        const resultBox = document.getElementById("mcp-result");

        if (!productId) {
            resultBox.textContent = "Please enter a product ID.";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/mcp/product/${productId}`);
            const result = await response.json();
            
            resultBox.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
            resultBox.textContent = "MCP request failed.";
        }
    }

    async function askRAG() {
        const query = document.getElementById("rag-query").value;
        const resultBox = document.getElementById("rag-result");

        if (!query.trim()) {
            resultBox.textContent = "Please enter a question.";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/rag/ask`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ query: query })
            });

            const result = await response.json();
            
            resultBox.textContent = 
                `Answer: ${result.answer || result.error}\n` +
                `Confidence: ${result.confidence_category || "N/A"}\n` +
                `Citations: ${JSON.stringify(result.citations || [], null, 2)}`;
        } catch (error) {
            resultBox.textContent = "RAG request failed.";
        }
    }

    loadProducts();
</script>

</body>
</html>
