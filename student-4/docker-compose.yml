services:
  database:
    build: .
    command: python database/app.py
    environment:
      ORDERS_DB_PATH: /app/data/orders.db
    volumes:
      - orders-data:/app/data
    ports:
      - "6004:6004"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6004/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    command: python backend/app.py
    ports:
      - "5004:5004"
    environment:
      DATABASE_URL: http://database:6004
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: qwen2.5:0.5b
      AI_ENABLED: ${AI_ENABLED:-true}
      MCP_URL: http://host.docker.internal:8100/mcp
      MCP_ENABLED: ${MCP_ENABLED:-false}
      ORDERS_MCP_SECRET: ${ORDERS_MCP_SECRET:-}
      RAG_URL: http://host.docker.internal:8200
      RAG_ENABLED: ${RAG_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: .
    command: python frontend/app.py
    ports:
      - "3004:3004"
    environment:
      API_BASE: http://localhost:5004
      SHARED_BASE: http://localhost:5000
    depends_on:
      - backend

volumes:
  orders-data:
