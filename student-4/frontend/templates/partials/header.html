<div class="bg-effects" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="bg-orb bg-orb-4"></div>
    <div class="bg-grid"></div>
</div>

<header id="header" class="scrolled">
    <div class="container header-inner">
        <a href="{{ shared_base }}{{ '/staff_dashboard' if staff_mode else '/' }}" class="logo">
            <span class="logo-mark" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 18h20l-2-9H4L2 18z"/>
                    <path d="M6 9V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v3"/>
                </svg>
            </span>
            <span class="logo-name">KICKLAB</span>
        </a>

        <nav id="ordersNavigation" aria-label="Order management">
            <ul class="main-nav">
                {% if staff_mode %}
                <li><a href="{{ shared_base }}/staff_dashboard">Staff Dashboard</a></li>
                <li><a href="#orders">Orders</a></li>
                {% else %}
                <li><a href="#orders">My Orders</a></li>
                <li><a href="#assistant">AI Mode</a></li>
                <li><a href="#mcp">MCP</a></li>
                <li><a href="#rag">RAG</a></li>
                {% endif %}
            </ul>
        </nav>

        <div class="header-actions">
            <a href="{{ shared_base }}/" class="btn btn-glass">{{ 'View Store' if staff_mode else 'Store Home' }}</a>
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle navigation"
                    aria-controls="ordersNavigation" aria-expanded="false">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<script>
    (() => {
        const header = document.getElementById('header');
        const toggle = document.getElementById('menuToggle');
        function closeNavigation() {
            header.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
        }
        toggle.addEventListener('click', () => {
            const open = header.classList.toggle('open');
            toggle.setAttribute('aria-expanded', String(open));
        });
        document.querySelectorAll('#ordersNavigation a').forEach(link => {
            link.addEventListener('click', closeNavigation);
        });
        header.addEventListener('keydown', event => {
            if (event.key === 'Escape' && header.classList.contains('open')) {
                closeNavigation();
                toggle.focus();
            }
        });
    })();
</script>
