name: Student 4 CI - Order Management

on:
  push:
    paths:
      - 'student-4/**'
      - 'docs/release-1/student-4/**'
      - 'scripts/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/agentic-loop/**'
      - 'shared/backend/**'
      - 'shared/Dockerfile'
      - 'shared/.dockerignore'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4-ci.yml'
  pull_request:
    paths:
      - 'student-4/**'
      - 'docs/release-1/student-4/**'
      - 'scripts/**'
      - 'ai-services/mcp-server/**'
      - 'ai-services/rag-server/**'
      - 'ai-services/agentic-loop/**'
      - 'shared/backend/**'
      - 'shared/Dockerfile'
      - 'shared/.dockerignore'
      - 'shared/frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/student-4-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: 'false'
      MCP_ENABLED: 'false'
      RAG_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        working-directory: student-4
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        working-directory: student-4
        run: pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      AI_ENABLED: 'false'
      MCP_ENABLED: 'false'
      RAG_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: student-4
        run: docker build -t student4-orders .

      - name: Validate Docker Compose config
        working-directory: student-4
        run: docker compose config --quiet

      - name: Validate root Docker Compose config
        run: docker compose config --quiet

      - name: Build shared login image
        run: docker build -t kicklab-shared ./shared
