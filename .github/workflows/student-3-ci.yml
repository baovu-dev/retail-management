name: Student 3 CI - Customer Account Management

on:
  push:
    paths:
      - 'student-3/**'
      - 'ai-services/multi-agent-server/evidence/student3_customers.py'
      - 'ai-services/multi-agent-server/evidence/__init__.py'
      - 'scripts/deploy/render_app_spec.py'
      - 'docker-compose.yml'
      - '.github/workflows/student-3-ci.yml'
  pull_request:
    paths:
      - 'student-3/**'
      - 'ai-services/multi-agent-server/evidence/student3_customers.py'
      - 'ai-services/multi-agent-server/evidence/__init__.py'
      - 'scripts/deploy/render_app_spec.py'
      - 'docker-compose.yml'
      - '.github/workflows/student-3-ci.yml'

env:
  MCP_ENABLED: "false"
  RAG_ENABLED: "false"
  AI_MODE_ENABLED: "false"
  MULTI_AGENT_ENABLED: "false"

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'


      - name: Install dependencies
        working-directory: student-3

        run: |
          pip install -r backend/requirements.txt
          pip install -r database/requirements.txt
          pip install pytest


      - name: Initialise database
        working-directory: student-3/database

        run: python init_db.py


      - name: Start database service
        working-directory: student-3

        run: |
          python database/app.py &
          sleep 5


      - name: Run pytest
        working-directory: student-3

        run: |
          PYTHONPATH=.:backend python -m pytest tests/ -v --ignore=tests/post_commit


  build:
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker image
        working-directory: student-3

        run: |
          docker build -t student3-customer-account .


      - name: Confirm local AI services are disabled in CI

        run: |
          echo "AI_MODE_ENABLED=${{ env.AI_MODE_ENABLED }}"
          echo "MCP_ENABLED=${{ env.MCP_ENABLED }}"
          echo "RAG_ENABLED=${{ env.RAG_ENABLED }}"
          echo "MULTI_AGENT_ENABLED=${{ env.MULTI_AGENT_ENABLED }}"

          test "${{ env.AI_MODE_ENABLED }}" = "false"
          test "${{ env.MCP_ENABLED }}" = "false"
          test "${{ env.RAG_ENABLED }}" = "false"
          test "${{ env.MULTI_AGENT_ENABLED }}" = "false"


  post-commit-endpoints:
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Start Student 3 services

        run: |
          docker compose up -d --build student3-backend


      - name: Wait for Student 3 backend

        run: |
          for i in $(seq 1 20); do

            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 5 \
              --max-time 20 \
              http://localhost:5003/customers || true)

            if [ "$code" = "200" ]; then
              echo "PASS http://localhost:5003/customers -> $code"
              exit 0
            fi

            echo "Retry $i/20 (got: ${code:-none})"

            sleep 3

          done

          echo "FAIL Student 3 backend did not become ready"

          docker compose logs \
            student3-backend \
            student3-database

          exit 1


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: '3.12'


      - name: Install post-commit test dependencies

        run: |
          pip install pytest requests


      - name: Run post-commit endpoint tests
        working-directory: student-3

        run: |
          mkdir -p reports/post-commit

          set +e

          python -m pytest tests/post_commit -v \
            | tee reports/post-commit/test-results.md

          status=${PIPESTATUS[0]}

          set -e

          echo "{\"status\": \"$([ $status -eq 0 ] && echo PASS || echo FAIL)\", \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"run_id\": \"${{ github.run_id }}\"}" \
            >> reports/post-commit/test-audit.jsonl

          cat > reports/post-commit/report.md << EOF
          ## Student 3 (Customer Account Management) post-commit endpoint report

          - Workflow: student-3-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Endpoints tested: get_customer (GET /customers/<customer_id>), get_all_customers (GET /customers)
          EOF

          exit $status


      - name: Upload post-commit test evidence
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: student-3-post-commit-tests
          path: student-3/reports/post-commit


      - name: Stop services
        if: always()

        run: |
          docker compose down -v