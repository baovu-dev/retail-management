name: Student 2 CI - Product Management

on:
  push:
    paths:
      - 'student-2/**'
      - 'ai-services/multi-agent-server/evidence/student2_products.py'
      - 'shared/frontend/templates/staff_dashboard.html'
      - '.github/workflows/student-2-ci.yml'
  pull_request:
    paths:
      - 'student-2/**'
      - 'ai-services/multi-agent-server/evidence/student2_products.py'
      - 'shared/frontend/templates/staff_dashboard.html'
      - '.github/workflows/student-2-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          pip install -r student-2/backend/requirements.txt
          pip install -r student-2/frontend/requirements.txt
          pip install -r student-2/database/requirements.txt
          pip install pytest

      - name: Initialize database
        run: python student-2/database/init_db.py

      - name: Test two Product backend endpoints and evidence shape
        run: python -m pytest student-2/tests/post_commit student-2/tests/test_product_evidence.py student-2/tests/test_multi_agent_frontend.py -q

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: student-2
        run: docker build -t student2-product-management .
